<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17211f" />
    <title>Wordwright</title>

    <!-- iOS's support for the Web App Manifest's display:standalone is
         inconsistent across versions; these legacy Apple meta tags are the
         more reliable way to get a true standalone (chrome-less) launch with
         its own persistent storage/cache when added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Wordwright" />

    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,700&display=swap"
      rel="stylesheet"
    />

    <script>
      (() =>
        !window.location.pathname.endsWith("/") &&
        window.location.replace(window.location.href + "/"))();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
